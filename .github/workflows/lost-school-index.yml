name: Hyrsylän kadonneiden verkkosivujen laajennettu haku
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/lost_school_web_index.py
      - .github/workflows/lost-school-index.yml
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/lost_school_web_index.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lost-school-web-index
          path: reports/lost-school-web-index.json
          retention-days: 60
          if-no-files-found: warn
