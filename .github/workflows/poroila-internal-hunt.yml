name: Poroilan alkuperäisten alisivujen Wayback-tutkimus
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/poroila_internal_hunt.py
      - .github/workflows/poroila-internal-hunt.yml

permissions:
  contents: read

jobs:
  recover-index:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hae alkuperäiset linkkikohteet Waybackin julkisista indekseistä
        run: python scripts/poroila_internal_hunt.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poroila-linked-html-index
          path: reports/poroila-deep-html-hunt.json
          retention-days: 60
          if-no-files-found: warn
