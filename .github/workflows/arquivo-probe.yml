name: Vaihtoehtoinen verkkoarkisto — Arquivo.pt
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/arquivo_probe.py
      - .github/workflows/arquivo-probe.yml
permissions:
  contents: read
jobs:
  inquiry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/arquivo_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arquivo-pt-public-metadata
          path: reports/arquivo-secondary-archive.json
          retention-days: 45
          if-no-files-found: warn
