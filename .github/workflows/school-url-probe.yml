name: Hyrsylän koulu — vanhojen URL-polkujen haku
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/school_url_probe.py
      - .github/workflows/school-url-probe.yml

permissions:
  contents: read

jobs:
  find-school-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/school_url_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: school-url-cdx-index
          path: reports/school-url-probe.json
          retention-days: 60
          if-no-files-found: warn
