name: Julkaise Hyrsylä / Jäljet GitHub Pagesiin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify:
    name: Check appearance and interactions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: SITE_PREFIX=/_site/ pnpm build
      - run: SITE_PREFIX=/_site/ python scripts/site_smoke.py
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Compare original and Eleventy pages on desktop and mobile
        shell: bash
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/site-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          python scripts/browser_parity.py

  deploy:
    needs: verify
    name: Rakenna, tarkista ja julkaise staattinen sivusto
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Hae lähdekoodi
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Asenna Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Asenna riippuvuudet
        run: pnpm install --frozen-lockfile

      - name: Kokoa GitHub Pages -polulla
        run: SITE_PREFIX=/poroila-jaljet/ pnpm build

      - name: Tarkista sivut, linkit ja alkuperäiskopiot
        run: SITE_PREFIX=/poroila-jaljet/ python3 scripts/site_smoke.py

      - name: Valmistele GitHub Pages
        uses: actions/configure-pages@v5

      - name: Lataa sivustopaketti
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Julkaise
        id: deployment
        uses: actions/deploy-pages@v4
