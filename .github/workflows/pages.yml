name: Julkaise Hyrsylä / Jäljet GitHub Pagesiin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/site-quality.yml

  deploy:
    needs: verify
    name: Rakenna, tarkista ja julkaise staattinen sivusto
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Hae lähdekoodi
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Asenna Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Asenna riippuvuudet
        run: pnpm install --frozen-lockfile

      - name: Kokoa GitHub Pages -polulla
        run: SITE_PREFIX=/poroila-jaljet/ pnpm build

      - name: Tarkista sivut, linkit ja alkuperäiskopiot
        run: SITE_PREFIX=/poroila-jaljet/ python3 scripts/site_smoke.py

      - name: Valmistele GitHub Pages
        uses: actions/configure-pages@v5

      - name: Lataa sivustopaketti
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Julkaise
        id: deployment
        uses: actions/deploy-pages@v4
