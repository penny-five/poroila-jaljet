name: Wayback-sivutekstien tarkistus

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/wayback_capture.py
      - .github/workflows/wayback-capture.yml

permissions:
  contents: read

jobs:
  read-archived-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read public indexed captures
        run: python scripts/wayback_capture.py
      - name: Save restricted-to-artifact review text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayback-capture-review
          path: reports/wayback-capture-text.json
          retention-days: 30
          if-no-files-found: warn
