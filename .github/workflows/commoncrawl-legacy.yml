name: Hyrsylän vanhojen verkkosivujen Common Crawl -haku
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/commoncrawl_legacy.py
      - .github/workflows/commoncrawl-legacy.yml
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/commoncrawl_legacy.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commoncrawl-school-index
          path: reports/commoncrawl-legacy-pages.json
          retention-days: 90
          if-no-files-found: warn
