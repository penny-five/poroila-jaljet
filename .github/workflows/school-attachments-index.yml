name: Koulun alkuperäisten liitetiedostojen arkistohaku
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/school_attachments_index.py
      - .github/workflows/school-attachments-index.yml
permissions:
  contents: read
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/school_attachments_index.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: school-attachments-index
          path: reports/school-attachments-index.json
          retention-days: 60
          if-no-files-found: warn
