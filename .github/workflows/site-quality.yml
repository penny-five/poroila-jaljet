name: Eleventy appearance and interaction checks
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
permissions:
  contents: read
concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: SITE_PREFIX=/_site/ pnpm build
      - run: SITE_PREFIX=/_site/ python scripts/site_smoke.py
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Compare original and Eleventy pages on desktop and mobile
        shell: bash
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/site-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          python scripts/browser_parity.py
