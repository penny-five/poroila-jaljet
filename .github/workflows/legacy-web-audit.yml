name: Koulun ja Poroilan vanhojen verkkosivujen tutkimus
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/legacy_web_audit.py
      - .github/workflows/legacy-web-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tutki linkkirakenteita ja Wayback-indeksiä
        run: python scripts/legacy_web_audit.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historialliset-verkkosivut-tutkimustiedot
          path: reports/legacy-web-audit.json
          retention-days: 60
          if-no-files-found: warn
