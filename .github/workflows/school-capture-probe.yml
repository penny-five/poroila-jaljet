name: Hyrsylän koulu — Wayback-koulusivujen tarkistus
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/school_capture_probe.py
      - .github/workflows/school-capture-probe.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/school_capture_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: school-archive-page-summary
          path: reports/school-archive-page-summary.json
          retention-days: 45
          if-no-files-found: warn
