name: Wayback-arkiston metatietotutkimus

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/wayback_probe.py
      - .github/workflows/wayback-research.yml

permissions:
  contents: read

jobs:
  archive-inquiry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public Wayback indexes
        run: python scripts/wayback_probe.py
      - name: Upload research metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayback-capture-index
          path: reports/wayback-probe.json
          retention-days: 90
          if-no-files-found: warn
