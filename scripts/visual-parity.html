<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Eleventy appearance regression checks</title>
<style>body{font:14px system-ui;background:#eee;color:#111}iframe{height:900px;border:0;display:block;margin:20px 0}pre{white-space:pre-wrap}button{padding:12px;margin:8px}</style>
<h1>Original / Eleventy appearance checks</h1>
<p>Serve the repository root and build with SITE_PREFIX=/_site/. Both frames use identical viewport sizes and fonts. Checks compare visible text, element order, layout geometry and computed styles.</p>
<button id="desktop">Run desktop (1440px)</button><button id="mobile">Run mobile (390px)</button>
<pre id="results">Ready</pre><iframe id="original" title="Original"></iframe><iframe id="migrated" title="Eleventy"></iframe>
<script>
const results=document.getElementById('results');
const original=document.getElementById('original'), migrated=document.getElementById('migrated');
const base=new URLSearchParams(location.search).get('base')||'/_site/';
const frameReady=async(frame,url,isOriginal,id)=>{
  const target=new URL(url,location.href);
  target.searchParams.set('parity',String(Date.now()));
  await new Promise((resolve,reject)=>{frame.onload=resolve;frame.onerror=reject;frame.src=target.href});
  const win=frame.contentWindow;
  const deadline=Date.now()+15000;
  while(isOriginal ? win.document.body.dataset.page!==id : !win.document.body.dataset.siteReady){
    if(Date.now()>deadline)throw Error('Initialization timed out: '+url);
    await new Promise(resolve=>setTimeout(resolve,20));
  }
  // Freeze moving tickers and color transitions at the same state in both
  // frames; the actual site's stylesheets remain untouched.
  const stable=win.document.createElement('style');
  // Newly archived material is checked separately by school_archive_smoke.py.
  // Hide only additive content blocks while comparing the frozen original layout.
  stable.textContent='*,*::before,*::after{animation:none!important;transition:none!important}[data-archive-expansion]{display:none!important}';
  win.document.head.append(stable);
  await win.document.fonts.ready;
  await Promise.all([...win.document.images].filter(image=>image.checkVisibility()).map(image=>{
    image.loading='eager';return image.decode().catch(()=>{});
  }));
  await new Promise(resolve=>win.requestAnimationFrame(()=>win.requestAnimationFrame(resolve)));
};
function snapshot(frame){
  const doc=frame.contentDocument,win=frame.contentWindow;
  // Current catalogue counts are asserted against live data separately. The
  // frozen comparison uses the same original record subset and counter wording.
  if(frame===migrated)for(const counter of doc.querySelectorAll('[data-catalog-count]')){
    const old=original.contentDocument.querySelector(`[data-catalog-count="${counter.dataset.catalogCount}"]`);
    if(old)counter.textContent=old.textContent;
  }
  const elements=[...doc.querySelectorAll('.topbar,.topbar *,#sectionNavigation,#sectionNavigation *,#pageTrail,#pageTrail *,main > section,main > section *,.footer,.footer *,dialog,dialog *')];
  return elements.filter(el=>el.checkVisibility()&&el.tagName!=='SCRIPT').map(el=>{
    const rect=el.getBoundingClientRect(),style=win.getComputedStyle(el);
    const directText=[...el.childNodes].filter(n=>n.nodeType===3).map(n=>n.textContent).join('').replace(/\s+/g,' ').trim();
    return [el.tagName,el.id,el.getAttribute('class')||'',directText,
      ...['x','y','width','height'].map(k=>Math.round(rect[k]*64)/64),
      ...['color','backgroundColor','fontFamily','fontSize','fontWeight','lineHeight','display','padding','margin','border','transform'].map(k=>style[k])];
  });
}
function differences(a,b){
  const diff=[];
  if(a.length!==b.length)diff.push({count:[a.length,b.length]});
  for(let i=0;i<Math.max(a.length,b.length);i++){
    if(JSON.stringify(a[i])!==JSON.stringify(b[i]))diff.push({index:i,original:a[i],eleventy:b[i]});
    if(diff.length>=4)break;
  }
  return diff;
}
function compareOriginalContentWithOriginalNavigation(){
  // The user explicitly requested a new taxonomy. Test the historical content
  // against an identical navigation shell; the actual new navigation is tested
  // independently in browser_parity.py before any comparison replaces its DOM.
  migrated.contentDocument.querySelector('[data-layout-feature="breadcrumbs"]')?.remove();
  migrated.contentDocument.querySelector('[data-layout-feature="page-heading"]')?.remove();
  migrated.contentDocument.querySelector('.page-heading')?.remove();
  migrated.contentDocument.querySelector('#collectionNavigation')?.remove();
  migrated.contentDocument.querySelector('[data-layout-feature="collection-navigation"]')?.remove();
  // Page titles and eyebrows are now a shared component, tested independently.
  // Remove the old presentation-specific title from the frozen DOM comparison.
  const root=original.contentDocument.getElementById(original.contentDocument.body.dataset.page);
  if(root&&root.id!=='alku'){
    const title=root.querySelector('h2');
    const wrapper=title?.closest('.section-heading');
    if(wrapper){
      wrapper.replaceWith(...wrapper.querySelectorAll(':scope > .section-tag,:scope > .source-total'));
    }else{
      const following=title?.nextElementSibling;
      root.querySelector('p.eyebrow')?.remove();
      root.querySelector('p.oral-type')?.remove();
      const lead=root.querySelector('p.heading-intro,p.oral-lead');
      if(lead)lead.remove();
      else if(root.id==='sivujaljet'&&following?.tagName==='P')following.remove();
      title?.remove();
    }
  }
  for(const selector of ['.topbar','#sectionNavigation','#pageTrail']){
    const old=original.contentDocument.querySelector(selector);
    const current=migrated.contentDocument.querySelector(selector);
    if(old&&current)current.replaceWith(migrated.contentDocument.importNode(old,true));
    else if(old&&selector==='#pageTrail')migrated.contentDocument.querySelector('main').prepend(migrated.contentDocument.importNode(old,true));
  }
  // Recovery status changes as new originals are saved. Its current data is
  // asserted separately; use old status wording only for the old layout check.
  for(const id of ['workCatalog','personCatalog']){
    const old=original.contentDocument.getElementById(id),current=migrated.contentDocument.getElementById(id);
    if(old&&current)Array.from(current.children).slice(old.children.length).forEach(entry=>entry.remove());
  }
  if(root?.id==='katalogi'){
    const oldHeadings=root.querySelectorAll('.archive-note-grid h3');
    migrated.contentDocument.querySelectorAll('#katalogi .archive-note-grid h3').forEach((heading,index)=>{if(oldHeadings[index])heading.textContent=oldHeadings[index].textContent});
    const oldNote=root.querySelector('.archive-primary-notes > p:not(.eyebrow)');
    const currentNote=migrated.contentDocument.querySelector('#katalogi .archive-primary-notes > p:not(.eyebrow)');
    if(oldNote&&currentNote)currentNote.replaceWith(migrated.contentDocument.importNode(oldNote,true));
  }
  if(root?.id==='oppilaat'){
    const old=root.querySelector('a[href="#/tuotokset"]'),current=migrated.contentDocument.querySelector('[data-work-total-link]');
    if(old&&current)current.textContent=old.textContent;
  }
  const oldSummaries=[...original.contentDocument.querySelectorAll('.catalog-entry > summary')];
  const oldByLabel=new Map(oldSummaries.map(summary=>[summary.querySelector('strong')?.textContent,summary]));
  const oldByRecord=new Map([...original.contentDocument.querySelectorAll('#dlcCatalog > .catalog-entry')].map(card=>[card.textContent.match(/DLC-[0-9]{4}/)?.[0],card.querySelector('summary')]));
  const newSummaries=[...migrated.contentDocument.querySelectorAll('.catalog-entry > summary')];
  newSummaries.forEach((summary,index)=>{
    const old=summary.parentElement.dataset.sourceRecord ? oldByRecord.get(summary.parentElement.dataset.sourceRecord) : oldByLabel.get(summary.querySelector('strong')?.textContent);
    if((summary.parentElement.hasAttribute('data-source-record')||summary.parentElement.hasAttribute('data-person-id')) && old &&
       summary.querySelector('strong')?.textContent===old.querySelector('strong')?.textContent){
      summary.querySelector('span').textContent=old.querySelector('span').textContent;
    }
  });
}
function exercise(frame,id){
  const doc=frame.contentDocument,win=frame.contentWindow;
  const root=doc.getElementById(id);
  const search=(selector,value)=>{
    const input=root.querySelector(selector);if(!input)throw Error('Missing control: '+selector);
    input.value=value;input.dispatchEvent(new win.Event('input',{bubbles:true}));
  };
  if(id==='aikajana')root.querySelector('[data-decade="1980"]').click();
  else if(id==='kouluaikajana')root.querySelector('[data-decade="2000"]').click();
  else if(id==='lahteet'){
    search('#sourceSearch','2005');
    doc.getElementById('sourceType').value='press';
    doc.getElementById('sourceType').dispatchEvent(new win.Event('change'));
  }
  else if(id==='henkilot')search('[data-catalog-search]','Aila');
  else if(id==='tuotokset')search('[data-catalog-search]','runo');
  else if(id==='kartta'){
    doc.querySelector('[data-id="letter"]').click();
    doc.querySelector('[data-filter="open"]').click();
  }
  else if(id==='aineisto')doc.querySelector('[data-article="tech"]').click();
  else return false;
  return true;
}
async function run(width){
  results.textContent='Running';document.body.dataset.status='running';
  original.style.width=migrated.style.width=width+'px';
  const routes=await (await fetch('../src/_data/legacyRoutes.json')).json();
  const reports=[];
  try{
    for(const [id,route] of Object.entries(routes)){
      await Promise.all([frameReady(original,'../tests/fixtures/original-site/index.html#/'+id,true,id),frameReady(migrated,base+route.replace(/^\//,''),false,id)]);
      compareOriginalContentWithOriginalNavigation();
      const diff=differences(snapshot(original),snapshot(migrated));
      reports.push({id,width,pass:!diff.length,diff});
      if(exercise(original,id)){
        exercise(migrated,id);
        const controlsDiff=differences(snapshot(original),snapshot(migrated));
        reports.push({id:id+' controls',width,pass:!controlsDiff.length,diff:controlsDiff});
      }
      results.textContent=JSON.stringify(reports,null,2);
    }
    for(const [label,route,id] of [
      ['person','/tekijat/H-f95b196f07/','H-f95b196f07'],
    ]){
      await Promise.all([frameReady(original,'../tests/fixtures/original-site/index.html#/henkilot/'+id,true,'henkilot'),frameReady(migrated,base+route.replace(/^\//,''),false,'henkilot')]);
      compareOriginalContentWithOriginalNavigation();
      const diff=differences(snapshot(original),snapshot(migrated));
      reports.push({id:label,width,pass:!diff.length,diff});
    }
    results.textContent=JSON.stringify(reports,null,2);
    document.body.dataset.status=reports.every(r=>r.pass)?'passed':'failed';
  }catch(e){results.textContent+='\n'+e.stack;document.body.dataset.status='error'}
}
document.getElementById('desktop').onclick=()=>run(1440);
document.getElementById('mobile').onclick=()=>run(390);
</script></html>
